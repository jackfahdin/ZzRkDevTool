[package]
name = "gui_gpui"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
zzrk-sys = { path = "../zzrk-sys" }
gpui-kit = "0.6"
# Already in the dependency tree via gpui; reused for the progress channel.
futures = "0.3"
# Already in the dependency tree; used for local HH:mm:ss timestamps.
chrono = "0.4"

[[bin]]
name = "gui_gpui"
path = "src/main.rs"
