# SPDX-License-Identifier: MIT
# 官方托管 Runner 优先用最新稳定 Action Major。
# self-hosted 升级前必须检查：最低 Runner 版本、Node.js runtime、Breaking Changes。
name: CI-macOS

on:
  push:
    branches: [main, master]
    # 精确版本格式与 CMake 版本在 prepare-source 中校验。
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  # 分支和版本标签独立排队，主分支更新不会取消正式版编译。
  group: ci-macos-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
env:
  QT_VERSION: 6.12.0

jobs:
  build:
    name: macOS Universal DMG
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-source
        id: source
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          # 基础桌面归档已包含 Svg 与 LinguistTools。
          cache: true
      - name: 构建 Universal 应用并打包
        run: |
          # 同一个 .app 包含 arm64 和 x86_64；Qt macOS 套件本身是 Universal。
          # Qt 6.12 官方预编译库最低要求 macOS 14.4；不能只降低应用部署目标。
          cmake -S . -B build/macos-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.4 \
            -DZZRK_BUNDLE_RUNTIME=ON \
            -DZZRK_MACOS_CODESIGN_IDENTITY=- \
            -DZZRK_WARNINGS_AS_ERRORS=ON
          cmake --build build/macos-release --parallel 4
          mkdir -p build/macos-release/diagnostics
          ctest --test-dir build/macos-release --output-on-failure --parallel 4 \
            --output-junit "$PWD/build/macos-release/diagnostics/ctest.xml"
          cpack --config build/macos-release/CPackConfig.cmake -G DragNDrop
      # SegFault 必须保留调用栈，不能只根据 Linux 的通过结果猜测 Cocoa 根因。
      # 此步骤只收集证据；原测试失败仍使整个 job 失败。
      - name: 收集 macOS GUI 崩溃回溯
        if: failure()
        continue-on-error: true
        timeout-minutes: 3
        run: python3 .github/scripts/macos-gui-diagnostics.py build/macos-release
      - name: 保存失败测试与系统崩溃报告
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-gui-diagnostics
          path: build/macos-release/diagnostics/
          if-no-files-found: warn
          retention-days: 14
      - name: 验证 DMG 内的应用和签名
        run: bash .github/scripts/verify-macos-package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: packages-macos
          path: build/macos-release/ZzRkDevTool-*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/publish-artifacts.yml
    with:
      platform: macos
      artifact: packages-macos
      version: ${{ needs.build.outputs.version }}
