# SPDX-License-Identifier: MIT

name: Cross-platform applications

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows MSVC application and TGZ
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.1
          arch: win64_msvc2022_64
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build, test, and package
        shell: pwsh
        run: |
          cmake --preset windows-msvc-release
          if ($LASTEXITCODE -ne 0) { throw "Configure failed" }
          cmake --build --preset windows-msvc-release --parallel
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }
          ctest --preset windows-msvc-release
          if ($LASTEXITCODE -ne 0) { throw "Tests failed" }
          cpack --preset windows-msvc-tgz
          if ($LASTEXITCODE -ne 0) { throw "Packaging failed" }

      - name: Validate packaged applications
        shell: pwsh
        run: |
          $archive = Get-ChildItem build/windows-msvc-release/ZzRkDevTool-*.tar.gz | Select-Object -First 1
          if (-not $archive) { throw "TGZ package is missing" }
          New-Item -ItemType Directory -Force build/windows-package | Out-Null
          Push-Location build/windows-package
          try {
            cmake -E tar xzf $archive.FullName
            if ($LASTEXITCODE -ne 0) { throw "TGZ extraction failed" }
          } finally {
            Pop-Location
          }
          $gui = Get-ChildItem build/windows-package -Recurse -Filter ZzRkDevTool.exe | Select-Object -First 1
          $cli = Get-ChildItem build/windows-package -Recurse -Filter zzrkdevtool-cli.exe | Select-Object -First 1
          if (-not $gui -or -not $cli) { throw "Packaged applications are missing" }
          $packageDirectoryName = $archive.Name -replace '\.tar\.gz$', ''
          if ($gui.Directory.Name -ne $packageDirectoryName -or $cli.DirectoryName -ne $gui.DirectoryName) {
            throw "Applications must be installed at the package root"
          }
          if (-not (Test-Path (Join-Path $gui.DirectoryName Qt6Core.dll))) { throw "Qt runtime is missing" }
          $usbDependencies = & dumpbin /DEPENDENTS $gui.FullName $cli.FullName
          if ($LASTEXITCODE -ne 0 -or $usbDependencies -match 'libusb.*\.dll') { throw "Unexpected shared libusb dependency" }
          $env:QT_QPA_PLATFORM = "offscreen"
          & $gui.FullName --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Packaged GUI smoke test failed" }
          & $cli.FullName --help
          if ($LASTEXITCODE -ne 0) { throw "Packaged CLI smoke test failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: zzrkdevtool-windows-unsigned
          path: build/windows-msvc-release/ZzRkDevTool-*.tar.gz
          if-no-files-found: error

  macos:
    name: macOS Clang application and DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.1
          arch: clang_64
          cache: true

      - name: Build, test, and package
        run: |
          cmake -S . -B build/macos-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DZZRK_BUNDLE_RUNTIME=ON \
            -DZZRK_MACOS_CODESIGN_IDENTITY=- \
            -DZZRK_WARNINGS_AS_ERRORS=ON
          cmake --build build/macos-release --parallel
          ctest --test-dir build/macos-release --output-on-failure
          cpack --config build/macos-release/CPackConfig.cmake -G DragNDrop

      - name: Validate packaged bundle
        run: |
          dmg="$(find build/macos-release -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg"
          mount_output="$(hdiutil attach -nobrowse -readonly "$dmg")"
          mount_point="$(printf '%s\n' "$mount_output" | tail -n 1 | sed 's#^.*\(/Volumes/.*\)$#\1#')"
          trap 'hdiutil detach "$mount_point"' EXIT
          test -x "$mount_point/ZzRkDevTool.app/Contents/MacOS/ZzRkDevTool"
          test -x "$mount_point/ZzRkDevTool.app/Contents/MacOS/zzrkdevtool-cli"
          test -f "$mount_point/ZzRkDevTool.app/Contents/PlugIns/platforms/libqcocoa.dylib"
          for executable in ZzRkDevTool zzrkdevtool-cli; do
            dependencies="$(otool -L "$mount_point/ZzRkDevTool.app/Contents/MacOS/$executable")"
            if printf '%s\n' "$dependencies" | grep -q 'libusb.*dylib'; then
              echo "Unexpected shared libusb dependency" >&2
              exit 1
            fi
          done
          QT_QPA_PLATFORM=offscreen \
            "$mount_point/ZzRkDevTool.app/Contents/MacOS/ZzRkDevTool" --smoke-test
          "$mount_point/ZzRkDevTool.app/Contents/MacOS/zzrkdevtool-cli" --help
          codesign --verify --deep --strict "$mount_point/ZzRkDevTool.app"

      - uses: actions/upload-artifact@v4
        with:
          name: zzrkdevtool-macos-ad-hoc-signed
          path: build/macos-release/*.dmg
          if-no-files-found: error

  windows-mingw:
    name: Windows MinGW GUI application
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.1
          arch: win64_mingw
          tools: tools_mingw1310
          cache: true
      - name: Build and test MinGW GUI
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${Qt6_DIR:-}" ]; then
            qt_cmake_dir="$(cygpath -u "${Qt6_DIR}")"
            qt_root="$(dirname "$(dirname "$(dirname "${qt_cmake_dir}")")")"
          elif [ -n "${QT_ROOT_DIR:-}" ]; then
            qt_root="$(cygpath -u "${QT_ROOT_DIR}")"
          else
            echo "install-qt-action did not expose Qt6_DIR or QT_ROOT_DIR" >&2
            exit 1
          fi
          tools_root="$(dirname "$(dirname "${qt_root}")")/Tools"
          mingw_bin="$(find "${tools_root}" -path '*/mingw1310_64/bin/gcc.exe' -print -quit)"
          if [ -z "${mingw_bin}" ]; then
            echo "Qt MinGW 13.1.0 toolchain was not installed under ${tools_root}" >&2
            exit 1
          fi
          mingw_bin="$(dirname "${mingw_bin}")"
          export PATH="${mingw_bin}:${PATH}"
          if command -v x86_64-w64-mingw32-gcc >/dev/null 2>&1; then
            export CC=x86_64-w64-mingw32-gcc
            export CXX=x86_64-w64-mingw32-g++
          else
            export CC=gcc
            export CXX=g++
          fi

          cmake -S . -B build/windows-mingw-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${qt_root}" \
            -DZZRK_BUILD_GUI=ON \
            -DZZRK_BUILD_CLI=ON \
            -DZZRK_BUILD_TESTS=ON \
            -DZZRK_BUNDLE_RUNTIME=OFF \
            -DZZRK_WARNINGS_AS_ERRORS=ON
          cmake --build build/windows-mingw-release --parallel
          ctest --test-dir build/windows-mingw-release --output-on-failure -R "^(gui_framework|gui_smoke)$"
