# SPDX-License-Identifier: MIT

name: Cross-platform applications

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows MSVC application and ZIP
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.1
          arch: win64_msvc2022_64
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build, test, and package
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libusb:x64-windows `
            "--overlay-ports=$PWD/packaging/windows/vcpkg-overlay-ports"
          $libusbRoot = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          $env:PATH = "$libusbRoot\bin;$env:PATH"
          cmake -S . -B build/windows-release -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DZZRK_LIBUSB_ROOT="$libusbRoot" `
            -DZZRK_BUNDLE_RUNTIME=ON `
            -DZZRK_WARNINGS_AS_ERRORS=ON
          cmake --build build/windows-release --parallel
          ctest --test-dir build/windows-release --output-on-failure
          cpack --config build/windows-release/CPackConfig.cmake -G ZIP

      - name: Validate packaged applications
        shell: pwsh
        run: |
          $archive = Get-ChildItem build/windows-release/*.zip | Select-Object -First 1
          Expand-Archive $archive.FullName -DestinationPath build/windows-package
          $gui = Get-ChildItem build/windows-package -Recurse -Filter ZzRkDevTool.exe | Select-Object -First 1
          $cli = Get-ChildItem build/windows-package -Recurse -Filter zzrkdevtool-cli.exe | Select-Object -First 1
          $libusb = Get-ChildItem build/windows-package -Recurse -Filter libusb-1.0.dll | Select-Object -First 1
          if (-not $gui -or -not $cli -or -not $libusb) { throw "Packaged runtime files are missing" }
          $env:QT_QPA_PLATFORM = "offscreen"
          & $gui.FullName --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Packaged GUI smoke test failed" }
          & $cli.FullName --help
          if ($LASTEXITCODE -ne 0) { throw "Packaged CLI smoke test failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: zzrkdevtool-windows-unsigned
          path: build/windows-release/*.zip
          if-no-files-found: error

  macos:
    name: macOS Clang application and DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.1
          arch: clang_64
          cache: true

      - name: Install libusb
        run: brew install libusb

      - name: Build, test, and package
        run: |
          cmake -S . -B build/macos-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DZZRK_LIBUSB_ROOT="$(brew --prefix libusb)" \
            -DZZRK_BUNDLE_RUNTIME=ON \
            -DZZRK_MACOS_CODESIGN_IDENTITY=- \
            -DZZRK_WARNINGS_AS_ERRORS=ON
          cmake --build build/macos-release --parallel
          ctest --test-dir build/macos-release --output-on-failure
          cpack --config build/macos-release/CPackConfig.cmake -G DragNDrop

      - name: Validate packaged bundle
        run: |
          dmg="$(find build/macos-release -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg"
          mount_output="$(hdiutil attach -nobrowse -readonly "$dmg")"
          mount_point="$(printf '%s\n' "$mount_output" | tail -n 1 | sed 's#^.*\(/Volumes/.*\)$#\1#')"
          trap 'hdiutil detach "$mount_point"' EXIT
          test -x "$mount_point/ZzRkDevTool.app/Contents/MacOS/ZzRkDevTool"
          test -x "$mount_point/ZzRkDevTool.app/Contents/MacOS/zzrkdevtool-cli"
          test -f "$mount_point/ZzRkDevTool.app/Contents/PlugIns/platforms/libqcocoa.dylib"
          find "$mount_point/ZzRkDevTool.app/Contents/Frameworks" \
            -maxdepth 1 -name 'libusb*.dylib' -print -quit | grep -q .
          otool -L "$mount_point/ZzRkDevTool.app/Contents/MacOS/zzrkdevtool-cli" \
            | grep -q '@rpath/libusb'
          otool -L "$mount_point/ZzRkDevTool.app/Contents/MacOS/ZzRkDevTool" \
            | grep -q '@rpath/'
          QT_QPA_PLATFORM=offscreen \
            "$mount_point/ZzRkDevTool.app/Contents/MacOS/ZzRkDevTool" --smoke-test
          "$mount_point/ZzRkDevTool.app/Contents/MacOS/zzrkdevtool-cli" --help
          codesign --verify --deep --strict "$mount_point/ZzRkDevTool.app"

      - uses: actions/upload-artifact@v4
        with:
          name: zzrkdevtool-macos-ad-hoc-signed
          path: build/macos-release/*.dmg
          if-no-files-found: error

  windows-mingw:
    name: Windows MinGW GUI application
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.1
          arch: win64_mingw
          cache: true
      - name: Build and test MinGW GUI
        shell: pwsh
        run: |
          if (-not $env:MINGW_INSTALL_ROOT) {
            throw "MINGW_INSTALL_ROOT must point to the matching Qt MinGW toolchain and libusb 1.0.30 root"
          }
          cmake -S . -B build/windows-mingw-release -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DZZRK_BUILD_GUI=ON `
            -DZZRK_BUILD_CLI=ON `
            -DZZRK_BUILD_TESTS=ON `
            -DZZRK_LIBUSB_ROOT="$env:MINGW_INSTALL_ROOT/libusb" `
            -DZZRK_BUNDLE_RUNTIME=OFF `
            -DZZRK_WARNINGS_AS_ERRORS=ON
          cmake --build build/windows-mingw-release --parallel
          ctest --test-dir build/windows-mingw-release --output-on-failure -R "gui_framework|gui_smoke"
