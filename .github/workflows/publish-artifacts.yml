# SPDX-License-Identifier: MIT
# 官方托管 Runner 优先用最新稳定 Action Major。
# self-hosted 升级前必须检查：最低 Runner 版本、Node.js runtime、Breaking Changes。
name: 发布平台产物（公共流程）

# 仅由三个平台 CI 调用；不接收 PR artifact 或外部 workflow_run 的代码。
on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      artifact:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    # 不能让不同平台共用同一 concurrency group，否则待运行的平台会被取消。
    concurrency:
      group: publish-${{ inputs.platform }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: release-input
      - name: 更新预发布或正式版草稿
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PLATFORM: ${{ inputs.platform }}
          RELEASE_VERSION: ${{ inputs.version }}
          # 正式版只认版本标签，与提交信息无关。
          RELEASE_KIND: ${{ github.ref_type == 'tag' && 'stable' || 'continuous' }}
        run: |
          # checkout 将轻量/附注标签都解析为提交；校验时统一使用提交 SHA。
          GITHUB_SHA=$(git rev-parse HEAD)
          export GITHUB_SHA
          bash .github/scripts/publish-release.sh
