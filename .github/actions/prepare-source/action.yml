name: 准备源码依赖与版本
description: 通过公开 HTTPS 拉取固定子模块，并从 CMake 项目读取发布版本
outputs:
  version:
    description: CMake project 中的三段版本号
    value: ${{ steps.version.outputs.version }}
runs:
  using: composite
  steps:
    # 先核对标签，再拉依赖和安装 Qt；错误版本不进入耗时编译。
    - name: 读取应用版本并校验版本标签
      id: version
      shell: bash
      run: |
        set -euo pipefail
        version=$(sed -nE 's/^    VERSION ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' CMakeLists.txt)
        bash .github/scripts/validate-version-ref.sh "$version"
        echo "version=$version" >> "$GITHUB_OUTPUT"
    # .gitmodules 保留本地 GitCode 来源；CI 按仓库映射到公开 GitHub 镜像。
    # 不需要本地 SSH 私钥；转换规则不会写入仓库或全局 Git 配置。
    - name: 拉取固定版本的子模块
      shell: bash
      run: bash .github/scripts/prepare-submodules.sh
